name: flutter
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
      - run: flutter create --project-name sibyl --platforms=macos,android,ios,windows,linux,web .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter analyze
        working-directory: app
